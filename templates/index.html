<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIDS Security Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-white p-4">
    <div class="container">
        <h1 class="mb-4">🚨 NIDS Detection Dashboard</h1>

        <div class="card bg-secondary text-white mb-4">
            <div class="card-header"><strong>Active System Status</strong></div>
            <div class="card-body">
                <p class="card-text">Sniffer Status: <span class="badge bg-success">MONITORING</span></p>
            </div>
        </div>

        <h3>Recent Security Alerts</h3>
        <table class="table table-dark table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Timestamp</th>
                    <th>Alert Type</th>
                    <th>Source IP</th>
                    <th>Source MAC</th>
                    <th>Details</th>
                </tr>
            </thead>
            <tbody>
                {% for alert in alerts %}
                <tr>
                    <td>{{ alert[0] }}</td>
                    <td>{{ alert[1] }}</td>
                    <td><span class="badge bg-danger">{{ alert[2] }}</span></td>
                    <td><code>{{ alert[4] }}</code></td>
                    <td><code>{{ alert[3] }}</code></td>
                    <td>{{ alert[5] }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
